<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starter</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #17211b;
        background: #f3f6f1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(680px, 100%);
        padding: clamp(36px, 8vw, 72px);
        border: 1px solid #dfe6dc;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 24px 70px rgba(36, 54, 42, 0.1);
      }

      p {
        margin: 0 0 16px;
        color: #55705e;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 10ch;
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5.5rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      .note {
        max-width: 46ch;
        margin-top: 28px;
        color: #637068;
        font-size: 1rem;
        line-height: 1.65;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Ready to build</p>
      <h1>Your new project starts here.</h1>
      <div class="note">
        This starter is running successfully. Replace this page with your
        application when you are ready.
      </div>
    </main>
  </body>
</html>
